name: Build Azeroth Mobile runtime APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-runtime-apk.yml'

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Azeroth Mobile project
        uses: actions/checkout@v4
      - name: Checkout WoW Mobile runtime base
        uses: actions/checkout@v4
        with:
          repository: marcocastignoli/wow-mobile
          ref: main
          path: runtime-source
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build dependencies
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
      - name: Patch runtime for controller mouse and touch handoff
        working-directory: runtime-source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/winlator/widget/InputControlsView.java")
          s = p.read_text()
          def once(old, new):
              global s
              if old not in s:
                  raise SystemExit("Expected source section not found: " + old[:90])
              s = s.replace(old, new, 1)
          once("import android.view.KeyEvent;\n", "import android.view.KeyEvent;\nimport android.view.InputDevice;\n")
          once("    private boolean showTouchscreenControls = true;\n", "    private boolean showTouchscreenControls = true;\n    private boolean externalControllerActive = false;\n")
          once("            if (showTouchscreenControls) for (ControlElement element : elements) element.draw(canvas);", """            externalControllerActive = hasExternalControllerConnected();
                      if (showTouchscreenControls) for (ControlElement element : elements) {
                          if (!externalControllerActive || !isMovementControl(element)) element.draw(canvas);
                      }""")
          once("    private synchronized ControlElement intersectElement(float x, float y) {", """    private boolean hasExternalControllerConnected() {
              for (int deviceId : InputDevice.getDeviceIds()) {
                  InputDevice device = InputDevice.getDevice(deviceId);
                  if (device != null && (device.supportsSource(InputDevice.SOURCE_GAMEPAD) ||
                      device.supportsSource(InputDevice.SOURCE_JOYSTICK))) return true;
              }
              return false;
          }

          private boolean isMovementControl(ControlElement element) {
              return element.getType() == ControlElement.Type.D_PAD ||
                     element.getType() == ControlElement.Type.STICK;
          }

          private synchronized ControlElement intersectElement(float x, float y) {""")
          once("        final float[] values = {state.thumbLX, state.thumbLY, state.thumbRX, state.thumbRY, state.getDPadX(), state.getDPadY()};", """        final float[] values = {state.thumbLX, state.thumbLY, state.thumbRX, state.thumbRY, state.getDPadX(), state.getDPadY()};
                  externalControllerActive = true;
                  mouseMoveOffset.x = Math.abs(state.thumbRX) > ControlElement.STICK_DEAD_ZONE ? state.thumbRX : 0;
                  mouseMoveOffset.y = Math.abs(state.thumbRY) > ControlElement.STICK_DEAD_ZONE ? state.thumbRY : 0;
                  if (mouseMoveOffset.x != 0 || mouseMoveOffset.y != 0) createMouseMoveTimer();
                  invalidate();""")
          once("                    for (ControlElement element : profile.getElements()) {\n                        if (element.handleTouchDown(pointerId, x, y)) handled = true;", """                    externalControllerActive = hasExternalControllerConnected();
                              for (ControlElement element : profile.getElements()) {
                                  if (externalControllerActive && isMovementControl(element)) continue;
                                  if (element.handleTouchDown(pointerId, x, y)) handled = true;""")
          once("                        for (ControlElement element : profile.getElements()) {\n                            if (element.handleTouchMove(movePointerId, x, y)) handled = true;", """                        externalControllerActive = hasExternalControllerConnected();
                                  for (ControlElement element : profile.getElements()) {
                                      if (externalControllerActive && isMovementControl(element)) continue;
                                      if (element.handleTouchMove(movePointerId, x, y)) handled = true;""")
          once("                    for (ControlElement element : profile.getElements()) if (element.handleTouchUp(pointerId, x, y)) handled = true;", """                    externalControllerActive = hasExternalControllerConnected();
                              for (ControlElement element : profile.getElements()) {
                                  if (externalControllerActive && isMovementControl(element)) continue;
                                  if (element.handleTouchUp(pointerId, x, y)) handled = true;
                              }""")
          p.write_text(s)
          PY
      - name: Add floating soft-keyboard shortcut
        working-directory: runtime-source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/winlator/XServerDisplayActivity.java")
          s = p.read_text()
          def once(old, new):
              global s
              if old not in s:
                  raise SystemExit("Expected activity section not found: " + old[:100])
              s = s.replace(old, new, 1)
          once("import android.view.KeyEvent;\n", "import android.view.KeyEvent;\nimport android.view.Gravity;\n")
          once("import android.widget.ArrayAdapter;\n", "import android.widget.ArrayAdapter;\nimport android.widget.Button;\n")
          once("""        rootView.addView(inputControlsView);

                  if (container != null""", """        rootView.addView(inputControlsView);

                  Button floatingKeyboardButton = new Button(this);
                  floatingKeyboardButton.setText("⌨");
                  floatingKeyboardButton.setTextSize(20);
                  floatingKeyboardButton.setAllCaps(false);
                  floatingKeyboardButton.setContentDescription("Open keyboard");
                  floatingKeyboardButton.setOnClickListener(view -> AppUtils.showKeyboard(this));
                  FrameLayout.LayoutParams keyboardParams = new FrameLayout.LayoutParams(
                      (int)(52 * getResources().getDisplayMetrics().density),
                      (int)(52 * getResources().getDisplayMetrics().density),
                      Gravity.BOTTOM | Gravity.END);
                  int keyboardMargin = (int)(16 * getResources().getDisplayMetrics().density);
                  keyboardParams.setMargins(keyboardMargin, keyboardMargin, keyboardMargin, keyboardMargin);
                  rootView.addView(floatingKeyboardButton, keyboardParams);

                  if (container != null""")
          p.write_text(s)
          PY
      - name: Restrict controller handoff to active profile controllers
        working-directory: runtime-source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/winlator/widget/InputControlsView.java")
          s = p.read_text()
          old = """    private boolean hasExternalControllerConnected() {
                      for (int deviceId : InputDevice.getDeviceIds()) {
                          InputDevice device = InputDevice.getDevice(deviceId);
                          if (device != null && (device.supportsSource(InputDevice.SOURCE_GAMEPAD) ||
                              device.supportsSource(InputDevice.SOURCE_JOYSTICK))) return true;
                      }
                      return false;
                  }"""
          new = """    private boolean hasExternalControllerConnected() {
                      if (profile == null) return false;
                      for (int deviceId : InputDevice.getDeviceIds()) {
                          ExternalController controller = profile.getController(deviceId);
                          if (controller != null && controller.isConnected()) return true;
                      }
                      return false;
                  }"""
          if old not in s:
              raise SystemExit("Expected controller detection method not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build installable debug APK
        working-directory: runtime-source
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/24.0.8215888"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: azeroth-mobile-runtime-debug
          path: runtime-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
