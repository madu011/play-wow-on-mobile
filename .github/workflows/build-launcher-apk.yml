name: Play WoW on Mobile - Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/build-launcher-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and build one APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Select Java 17 for Gradle
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload the single APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-wow-on-mobile-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
