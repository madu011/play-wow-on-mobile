name: Build Azeroth Mobile launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/build-launcher-apk.yml'

permissions:
  contents: read

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: azeroth-mobile-launcher
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
